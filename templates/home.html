<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gummy Worms</title>

<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='flashcards.css') }}">
</head>
<body>
<div id="account-bar" class="account-bar"></div>

<header class="brand">
<img class="brand-logo" src="{{ url_for('static', filename='logo.png') }}" alt="">
<p class="brand-name">Gummy Worms</p>
</header>

<h1 class="home-title">Apprendre le français</h1>

<p id="stats" class="stats"></p>
<div id="continue-box" class="continue-box"></div>

<ul id="lesson-list">
  {% for lesson in lessons %}
<li data-lesson="{{ lesson.id }}" data-title="{{ lesson.title }}" data-words="{{ lesson.vocab | length }}" data-locked="{{ 1 if lesson.requires_login else 0 }}"><a href="/lesson/{{ lesson.id }}">{{ lesson.title }}{% if lesson.requires_login and not signed_in %}<span class="lock" title="Sign in to open this lesson">🔒</span>{% endif %}</a><span class="lesson-stars"></span></li>
  {% endfor %}
</ul>

<script src="{{ url_for('static', filename='sets.js') }}"></script>
<script src="{{ url_for('static', filename='progress.js') }}"></script>
</body>
</html>
